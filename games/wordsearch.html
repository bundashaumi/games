<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Word Search: Hobbies - Bunda Shaumi</title>
    
    <!-- Google Fonts: Fredoka & Nunito -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Shared Data Bank -->
    <script src="../js/data.js"></script>

    <style>
        :root {
            --font-display: 'Fredoka', sans-serif;
            --font-body: 'Nunito', sans-serif;
        }

        body {
            font-family: var(--font-body);
            background: linear-gradient(135deg, #e0f2fe 0%, #fef9c3 50%, #fce7f3 100%);
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .font-display { font-family: var(--font-display); }

        #word-grid-wrapper {
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        .btn-bubbly {
            transition: transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.12s ease;
        }
        .btn-bubbly:active { transform: translateY(3px) scale(0.97); }

        @keyframes pulseTap {
            0%, 100% {
                transform: scale(0.88);
                box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7);
            }
            50% {
                transform: scale(1.04);
                box-shadow: 0 0 0 10px rgba(59, 130, 246, 0);
            }
        }
        .tap-start-cell {
            background-color: rgba(59, 130, 246, 0.28) !important;
            border: 3px solid #2563eb !important;
            border-radius: 14px;
            animation: pulseTap 1.1s infinite;
            color: #1d4ed8 !important;
        }

        @keyframes hintGlow {
            0%, 100% {
                transform: scale(0.92);
                background-color: rgba(250, 204, 21, 0.45);
                box-shadow: 0 0 0 0 rgba(234, 179, 8, 0.85);
            }
            50% {
                transform: scale(1.12);
                background-color: rgba(250, 204, 21, 0.85);
                box-shadow: 0 0 0 12px rgba(234, 179, 8, 0);
            }
        }
        .hint-cell {
            border: 3px solid #eab308 !important;
            border-radius: 14px;
            animation: hintGlow 0.9s infinite;
            z-index: 15;
        }

        @keyframes gentleShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-3px); }
        }
        .shake-board { animation: gentleShake 0.3s ease-in-out; }

        @keyframes wordPop {
            0% { transform: scale(1); }
            45% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }
        .word-found-pop { animation: wordPop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1); }

        @keyframes speakerBounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3); }
        }
        .speaking-icon { animation: speakerBounce 0.45s ease-in-out 2; }

        .board-size {
            width: min(92vw, 500px);
            height: min(92vw, 500px);
        }

        @media (min-width: 1024px) and (orientation: landscape) {
            body {
                height: 100vh;
                height: 100dvh;
                overflow: hidden;
            }
            .board-size {
                width: min(82vh, 52vw, 680px);
                height: min(82vh, 52vw, 680px);
            }
        }

        @keyframes toastSlide {
            0% { opacity: 0; transform: translate(-50%, -18px) scale(0.92); }
            15% { opacity: 1; transform: translate(-50%, 0) scale(1); }
            85% { opacity: 1; transform: translate(-50%, 0) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -12px) scale(0.95); }
        }
        .toast-animate { animation: toastSlide 2.1s ease forwards; }
    </style>
</head>
<body class="text-slate-800 flex flex-col">

    <canvas id="confetti-canvas" class="fixed inset-0 pointer-events-none z-50 hidden"></canvas>
    <div id="toast-container" class="fixed top-4 left-1/2 z-40 pointer-events-none"></div>

    <div class="w-full max-w-7xl mx-auto px-3 py-2 sm:px-5 sm:py-3 lg:py-4 flex-1 flex flex-col lg:h-full justify-between">
        
        <!-- Header Atas -->
        <header class="flex flex-wrap items-center justify-between gap-2 mb-2 lg:mb-3 bg-white/85 backdrop-blur-md rounded-2xl px-3 py-2 sm:px-5 sm:py-2.5 shadow-sm border-2 border-white">
            <div class="flex items-center gap-2.5">
                <div class="w-10 h-10 sm:w-12 sm:h-12 rounded-full overflow-hidden border-2 border-orange-400 shadow-md shrink-0 flex items-center justify-center">
                    <img src="../bunda_shaumi.png" alt="Bunda Shaumi" class="w-full h-full object-cover" />
                </div>
                <div>
                    <h1 class="font-display text-lg sm:text-2xl lg:text-3xl font-bold text-indigo-700 leading-tight">
                        Word Search: <span class="text-orange-500">Hobbies</span>
                    </h1>
                    <p class="text-xs sm:text-sm font-bold text-slate-500 -mt-0.5">
                        Bahasa Inggris Kelas 3 SD • Geser atau Ketuk Awal &amp; Akhir
                    </p>
                </div>
            </div>

            <div class="flex items-center gap-2 sm:gap-3">
                <button onclick="toggleFullscreen()" title="Fullscreen"
                    class="btn-bubbly flex items-center gap-1 bg-white hover:bg-slate-100 border-2 border-amber-300 text-slate-800 px-3 py-1.5 rounded-xl font-display font-bold text-xs sm:text-sm shadow-sm cursor-pointer">
                    <span>⛶</span>
                    <span class="hidden md:inline">Fullscreen</span>
                </button>
                <div class="flex items-center gap-1.5 bg-emerald-100 border-2 border-emerald-300 text-emerald-800 px-3 py-1.5 rounded-xl font-display font-bold text-sm sm:text-base shadow-sm">
                    <span>⭐</span>
                    <span id="progress-text">0 / 6</span>
                </div>
                <button id="btn-sound" onclick="toggleSound()" aria-label="Suara"
                    class="btn-bubbly flex items-center gap-1.5 bg-sky-100 hover:bg-sky-200 border-2 border-sky-300 text-sky-800 px-3 py-1.5 sm:px-4 sm:py-2 rounded-xl font-bold text-sm sm:text-base shadow-sm cursor-pointer">
                    <span id="sound-icon" class="text-lg sm:text-xl">🔊</span>
                    <span id="sound-label" class="hidden sm:inline">Suara</span>
                </button>
            </div>
        </header>

        <!-- Area Permainan Utama -->
        <main class="flex-1 flex flex-col lg:flex-row items-center lg:items-stretch justify-center gap-3 sm:gap-4 lg:gap-6 min-h-0">
            <!-- Papan Grid 9x9 -->
            <section class="flex flex-col items-center justify-center shrink-0">
                <div class="bg-white/95 p-2.5 sm:p-3.5 lg:p-4 rounded-3xl shadow-xl border-4 border-indigo-200 relative">
                    <div id="word-grid-wrapper" class="board-size relative rounded-2xl bg-indigo-50/70 border-2 border-indigo-100 overflow-hidden">
                        <svg id="highlight-svg" viewBox="0 0 900 900" class="absolute inset-0 w-full h-full pointer-events-none z-10">
                            <g id="found-lines-group"></g>
                            <line id="active-drag-line" x1="0" y1="0" x2="0" y2="0"
                                stroke="#38bdf8" stroke-opacity="0.55" stroke-width="76" stroke-linecap="round"
                                class="hidden" />
                        </svg>
                        <div id="letter-grid" class="grid grid-cols-9 grid-rows-9 w-full h-full relative z-20"></div>
                    </div>
                </div>
            </section>

            <!-- Kolom Daftar Kata & Tombol Aksi -->
            <section class="w-full max-w-xl lg:max-w-none lg:flex-1 flex flex-col justify-between gap-2.5 sm:gap-3 bg-white/85 backdrop-blur-md rounded-3xl p-3 sm:p-4 lg:p-5 shadow-lg border-4 border-white min-h-0">
                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <span class="font-display text-sm sm:text-base font-bold text-slate-600">Pilih Paket Hobi:</span>
                        <span class="text-xs font-bold text-indigo-500 bg-indigo-50 px-2.5 py-0.5 rounded-full">
                            🔊 Ketuk kata untuk dengar suara
                        </span>
                    </div>
                    <div class="grid grid-cols-3 gap-2">
                        <button onclick="selectPack('pack1')" id="tab-pack1"
                            class="btn-bubbly py-2 sm:py-2.5 px-2 rounded-2xl font-display font-bold text-sm sm:text-base border-b-4 transition-all cursor-pointer">
                            📘 Paket 1
                        </button>
                        <button onclick="selectPack('pack2')" id="tab-pack2"
                            class="btn-bubbly py-2 sm:py-2.5 px-2 rounded-2xl font-display font-bold text-sm sm:text-base border-b-4 transition-all cursor-pointer">
                            📗 Paket 2
                        </button>
                        <button onclick="selectPack('mix')" id="tab-mix"
                            class="btn-bubbly py-2 sm:py-2.5 px-2 rounded-2xl font-display font-bold text-sm sm:text-base border-b-4 transition-all cursor-pointer">
                            🎲 Acak
                        </button>
                    </div>
                </div>

                <div class="flex-1 flex flex-col justify-center min-h-0">
                    <div id="word-list" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-2 gap-2 sm:gap-2.5"></div>
                </div>

                <div class="grid grid-cols-2 gap-2.5 sm:gap-3 pt-1">
                    <button id="btn-hint" onclick="useHint()"
                        class="btn-bubbly flex items-center justify-center gap-2 bg-gradient-to-b from-amber-300 to-amber-400 hover:from-amber-400 hover:to-amber-500 text-amber-950 font-display font-bold text-base sm:text-lg lg:text-xl py-3 sm:py-3.5 px-4 rounded-2xl border-b-4 border-amber-600 shadow-md cursor-pointer">
                        <span class="text-xl sm:text-2xl">💡</span> <span>Bantuan</span>
                    </button>
                    <button id="btn-reset" onclick="startNewGame()"
                        class="btn-bubbly flex items-center justify-center gap-2 bg-gradient-to-b from-indigo-400 to-indigo-500 hover:from-indigo-500 hover:to-indigo-600 text-white font-display font-bold text-base sm:text-lg lg:text-xl py-3 sm:py-3.5 px-4 rounded-2xl border-b-4 border-indigo-700 shadow-md cursor-pointer">
                        <span class="text-xl sm:text-2xl">🔄</span> <span>Acak Ulang</span>
                    </button>
                </div>
            </section>
        </main>
    </div>

    <!-- Modal Perayaan Kemenangan -->
    <div id="victory-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/50 backdrop-blur-sm p-4">
        <div class="bg-white rounded-[2rem] max-w-md w-full p-6 sm:p-8 text-center shadow-2xl border-4 border-amber-300 transform transition-all scale-95 opacity-0" id="victory-card">
            <div class="w-20 h-20 mx-auto rounded-full overflow-hidden border-4 border-amber-400 shadow-md mb-2">
                <img src="../bunda_shaumi.png" alt="Bunda Shaumi" class="w-full h-full object-cover" />
            </div>
            <h2 class="font-display text-2xl sm:text-3xl font-bold text-indigo-700 mb-2">
                Hebat! Semua Hobi Ditemukan! 🎉
            </h2>
            <p class="text-slate-600 font-bold text-sm sm:text-base mb-5">
                Bunda Shaumi bangga kamu sangat pintar membaca kosakata Bahasa Inggris!
            </p>
            <div class="flex justify-center gap-2 text-4xl sm:text-5xl mb-6">
                <span>⭐</span><span>⭐</span><span>⭐</span>
            </div>
            <div class="flex flex-col sm:flex-row gap-3">
                <button onclick="closeVictoryAndRestart()"
                    class="btn-bubbly flex-1 bg-gradient-to-b from-emerald-400 to-emerald-500 hover:from-emerald-500 hover:to-emerald-600 text-white font-display font-bold text-lg sm:text-xl py-3.5 px-5 rounded-2xl border-b-4 border-emerald-700 shadow-lg cursor-pointer">
                    🎮 Main Lagi
                </button>
                <button onclick="closeVictoryAndNextPack()"
                    class="btn-bubbly flex-1 bg-gradient-to-b from-sky-400 to-sky-500 hover:from-sky-500 hover:to-sky-600 text-white font-display font-bold text-lg sm:text-xl py-3.5 px-5 rounded-2xl border-b-4 border-sky-700 shadow-lg cursor-pointer">
                    ✨ Ganti Paket
                </button>
            </div>
        </div>
    </div>

    <!-- SCRIPT ENGINE WORD SEARCH -->
    <script src="../js/game-wordsearch.js"></script>
</body>
</html>
