<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hobby Match: Grade 3 - Bunda Shaumi</title>

    <!-- Google Fonts: Fredoka & Nunito -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Shared Data Bank -->
    <script src="../js/data.js"></script>

    <style>
        :root {
            --font-display: 'Fredoka', sans-serif;
            --font-body: 'Nunito', sans-serif;
        }

        html, body {
            font-family: var(--font-body);
            background: linear-gradient(135deg, #dbeafe 0%, #fef9c3 48%, #fce7f3 100%);
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
            overflow-y: auto;
        }

        .font-display { font-family: var(--font-display); }

        .btn-bubbly {
            transition: transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.12s ease;
        }
        .btn-bubbly:active { transform: translateY(3px) scale(0.97); }

        .card-selected {
            transform: scale(1.04);
            box-shadow: 0 0 0 4px #3b82f6, 0 12px 24px -6px rgba(59, 130, 246, 0.35) !important;
            border-color: #2563eb !important;
            z-index: 20;
        }

        @keyframes gentleShake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-7px); }
            40% { transform: translateX(7px); }
            60% { transform: translateX(-5px); }
            80% { transform: translateX(5px); }
        }
        .shake-card { animation: gentleShake 0.42s ease-in-out; }

        @keyframes matchPop {
            0% { transform: scale(1); }
            45% { transform: scale(1.06); }
            100% { transform: scale(1); }
        }
        .match-pop { animation: matchPop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1); }

        @keyframes hintPulse {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.85);
                transform: scale(1);
            }
            50% {
                box-shadow: 0 0 0 10px rgba(245, 158, 11, 0);
                transform: scale(1.04);
            }
        }
        .hint-glow {
            border-color: #f59e0b !important;
            background-color: #fef3c7 !important;
            animation: hintPulse 0.85s infinite;
            z-index: 25;
        }

        @keyframes drawLine {
            from { stroke-dashoffset: 1200; }
            to { stroke-dashoffset: 0; }
        }
        .line-draw {
            stroke-dasharray: 1200;
            animation: drawLine 0.45s ease-out forwards;
        }

        .memory-card-scene { perspective: 1000px; }
        .memory-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.52s cubic-bezier(0.34, 1.45, 0.64, 1);
            transform-style: preserve-3d;
        }
        .memory-card-inner.is-flipped { transform: rotateY(180deg); }
        .memory-card-face {
            position: absolute;
            inset: 0;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 1.5rem;
        }
        .memory-card-front { transform: rotateY(180deg); }
        .card-back-pattern {
            background-color: #6366f1;
            background-image: radial-gradient(rgba(255, 255, 255, 0.25) 2.5px, transparent 2.5px);
            background-size: 16px 16px;
        }

        @keyframes toastSlide {
            0% { opacity: 0; transform: translate(-50%, -18px) scale(0.92); }
            15% { opacity: 1; transform: translate(-50%, 0) scale(1); }
            85% { opacity: 1; transform: translate(-50%, 0) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -12px) scale(0.95); }
        }
        .toast-animate { animation: toastSlide 2.0s ease forwards; }

        @keyframes speakerPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.28); }
        }
        .speaker-active { animation: speakerPulse 0.4s ease-in-out 2; }
    </style>
</head>
<body class="min-h-dvh text-slate-800 flex flex-col">

    <canvas id="confetti-canvas" class="fixed inset-0 pointer-events-none z-50 hidden"></canvas>
    <div id="toast-container" class="fixed top-4 left-1/2 z-40 pointer-events-none"></div>

    <div class="w-full max-w-5xl mx-auto px-3 py-2 sm:px-5 sm:py-3 flex flex-col gap-2.5 sm:gap-3">

        <!-- HEADER ATAS -->
        <header class="bg-white/90 backdrop-blur-md rounded-2xl sm:rounded-3xl px-3 py-2 sm:px-4 sm:py-2 shadow-sm border-2 border-white flex flex-wrap items-center justify-between gap-2">
            <div class="flex items-center gap-2.5">
                <div class="w-10 h-10 sm:w-12 sm:h-12 rounded-full overflow-hidden border-2 border-pink-400 shadow-md shrink-0 flex items-center justify-center">
                    <img src="../bunda_shaumi.png" alt="Bunda Shaumi" class="w-full h-full object-cover" />
                </div>
                <div>
                    <h1 class="font-display text-lg sm:text-2xl font-bold text-indigo-700 leading-tight">
                        Hobby Match <span class="text-pink-500">Grade 3</span>
                    </h1>
                    <p id="mode-subtitle" class="text-xs sm:text-sm font-bold text-slate-500 -mt-0.5">
                        Ketuk gambar lalu ketuk nama hobinya!
                    </p>
                </div>
            </div>

            <!-- Switcher 2 Mode -->
            <div class="flex items-center bg-slate-100 p-1 rounded-2xl border-2 border-slate-200 order-3 sm:order-2 w-full sm:w-auto">
                <button id="tab-connect" onclick="switchMode('connect')"
                    class="btn-bubbly flex-1 sm:flex-none px-3 sm:px-4 py-1.5 sm:py-2 rounded-xl font-display font-bold text-sm sm:text-base transition-all cursor-pointer">
                    🔗 Sambung Pasangan
                </button>
                <button id="tab-memory" onclick="switchMode('memory')"
                    class="btn-bubbly flex-1 sm:flex-none px-3 sm:px-4 py-1.5 sm:py-2 rounded-xl font-display font-bold text-sm sm:text-base transition-all cursor-pointer">
                    🃏 Buka Kartu
                </button>
            </div>

            <!-- Kontrol Kanan: Fullscreen, Skor & Suara -->
            <div class="flex items-center gap-1.5 sm:gap-2 order-2 sm:order-3">
                <button onclick="toggleFullscreen()" title="Fullscreen"
                    class="btn-bubbly flex items-center gap-1 bg-white hover:bg-slate-100 border-2 border-amber-300 text-slate-800 px-2.5 sm:px-3 py-1.5 rounded-xl font-display font-bold text-xs sm:text-sm shadow-sm cursor-pointer">
                    <span>⛶</span>
                    <span class="hidden md:inline">Fullscreen</span>
                </button>
                <div class="flex items-center gap-1 bg-emerald-100 border-2 border-emerald-300 text-emerald-800 px-2.5 sm:px-3 py-1.5 rounded-xl font-display font-bold text-sm sm:text-base shadow-sm">
                    <span>⭐</span> <span id="progress-badge">0 / 5</span>
                </div>
                <div id="moves-pill" class="hidden items-center gap-1 bg-amber-100 border-2 border-amber-300 text-amber-900 px-2.5 sm:px-3 py-1.5 rounded-xl font-display font-bold text-sm sm:text-base shadow-sm">
                    <span>👆</span> <span id="moves-badge">0</span>
                </div>
                <button id="btn-sound" onclick="toggleSound()" aria-label="Suara"
                    class="btn-bubbly flex items-center justify-center bg-sky-100 hover:bg-sky-200 border-2 border-sky-300 text-sky-800 w-10 h-10 sm:w-11 sm:h-11 rounded-xl font-bold text-lg sm:text-xl shadow-sm cursor-pointer"
                    title="Aktifkan/Matikan Suara">
                    <span id="sound-icon">🔊</span>
                </button>
            </div>
        </header>

        <!-- AREA PERMAINAN -->
        <main class="w-full flex flex-col relative">
            <!-- MODE 1: SAMBUNG PASANGAN -->
            <section id="connect-board" class="relative w-full bg-white/75 backdrop-blur-sm rounded-3xl p-3 sm:p-4 border-4 border-white shadow-lg flex flex-col">
                <div class="grid grid-cols-2 gap-8 sm:gap-20 lg:gap-32 mb-2.5">
                    <div class="text-center font-display font-bold text-xs sm:text-sm text-indigo-600 bg-indigo-100/80 py-1 rounded-xl">
                        🖼️ Gambar Hobi
                    </div>
                    <div class="text-center font-display font-bold text-xs sm:text-sm text-pink-600 bg-pink-100/80 py-1 rounded-xl">
                        🔤 Nama Hobi (English)
                    </div>
                </div>

                <div id="connect-stage" class="relative grid grid-cols-2 gap-8 sm:gap-20 lg:gap-32">
                    <svg id="connect-svg" class="absolute inset-0 w-full h-full pointer-events-none z-10 overflow-visible"></svg>
                    <div id="picture-column" class="flex flex-col gap-2.5 sm:gap-3 relative z-20"></div>
                    <div id="word-column" class="flex flex-col gap-2.5 sm:gap-3 relative z-20"></div>
                </div>
            </section>

            <!-- MODE 2: BUKA KARTU -->
            <section id="memory-board" class="hidden w-full bg-white/75 backdrop-blur-sm rounded-3xl p-3 sm:p-4 border-4 border-white shadow-lg flex-col">
                <div id="memory-grid" class="grid grid-cols-2 md:grid-cols-5 gap-2.5 sm:gap-3.5"></div>
            </section>
        </main>

        <!-- FOOTER TOMBOL AKSI -->
        <footer class="flex items-center justify-center gap-3 pt-0.5 pb-2">
            <button id="btn-hint" onclick="triggerHint()"
                class="btn-bubbly flex items-center justify-center gap-2 bg-gradient-to-b from-amber-300 to-amber-400 hover:from-amber-400 hover:to-amber-500 text-amber-950 font-display font-bold text-base sm:text-lg px-5 sm:px-7 py-2.5 sm:py-3 rounded-2xl border-b-4 border-amber-600 shadow-md cursor-pointer">
                <span class="text-xl sm:text-2xl">💡</span> <span>Bantuan</span>
            </button>
            <button id="btn-new-round" onclick="startNewRound()"
                class="btn-bubbly flex items-center justify-center gap-2 bg-gradient-to-b from-indigo-400 to-indigo-500 hover:from-indigo-500 hover:to-indigo-600 text-white font-display font-bold text-base sm:text-lg px-5 sm:px-7 py-2.5 sm:py-3 rounded-2xl border-b-4 border-indigo-700 shadow-md cursor-pointer">
                <span class="text-xl sm:text-2xl">🔄</span> <span>Ronde Baru</span>
            </button>
        </footer>
    </div>

    <!-- MODAL KEMENANGAN -->
    <div id="victory-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/55 backdrop-blur-sm p-3 sm:p-4">
        <div id="victory-card" class="bg-white rounded-[2rem] max-w-lg w-full p-5 sm:p-7 text-center shadow-2xl border-4 border-amber-300 transform transition-all scale-95 opacity-0 max-h-[94dvh] overflow-y-auto">
            <div class="w-20 h-20 mx-auto rounded-full overflow-hidden border-4 border-amber-400 shadow-md mb-2">
                <img src="../bunda_shaumi.png" alt="Bunda Shaumi" class="w-full h-full object-cover" />
            </div>
            <h2 class="font-display text-2xl sm:text-3xl font-bold text-indigo-700">Hebat! Great Job! 🎉</h2>
            <p id="victory-subtitle" class="text-slate-500 font-bold text-sm sm:text-base mt-0.5 mb-3">
                Semua pasangan hobi berhasil kamu cocokkan!
            </p>

            <div id="victory-stars" class="flex justify-center gap-2 text-4xl sm:text-5xl mb-4"></div>

            <div class="bg-sky-50/90 border-2 border-sky-200 rounded-2xl p-3 mb-5 text-left">
                <div class="flex items-center justify-between mb-2">
                    <span class="font-display font-bold text-sm text-sky-800">📚 Hobi di Ronde Ini:</span>
                    <span class="text-xs font-bold text-sky-600">Ketuk untuk dengar 🔊</span>
                </div>
                <div id="victory-summary-list" class="grid grid-cols-1 sm:grid-cols-2 gap-2"></div>
            </div>

            <div class="flex flex-col sm:flex-row gap-2.5">
                <button onclick="nextRoundFromVictory()"
                    class="btn-bubbly flex-1 bg-gradient-to-b from-emerald-400 to-emerald-500 hover:from-emerald-500 hover:to-emerald-600 text-white font-display font-bold text-lg py-3 px-4 rounded-2xl border-b-4 border-emerald-700 shadow-lg cursor-pointer">
                    ▶️ Ronde Berikutnya
                </button>
                <button onclick="switchModeFromVictory()"
                    class="btn-bubbly flex-1 bg-gradient-to-b from-pink-400 to-pink-500 hover:from-pink-500 hover:to-pink-600 text-white font-display font-bold text-lg py-3 px-4 rounded-2xl border-b-4 border-pink-700 shadow-lg cursor-pointer">
                    🔀 Ganti Mode
                </button>
            </div>
        </div>
    </div>

    <!-- SCRIPT ENGINE HOBBY MATCH -->
    <script src="../js/game-match.js"></script>
</body>
</html>
